<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f2c">
  <title>Chúc Như Ý ngủ ngon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="night.css">
</head>
<body>

  <div class="aurora" aria-hidden="true"></div>
  <canvas id="galaxy" aria-hidden="true"></canvas>

  <div class="sky" id="sky">
    <div class="moon"></div>
    <div class="hill one"></div>
    <div class="hill two"></div>
  </div>

  <main class="content">
    <p class="time-greeting"><i class="fa-regular fa-moon"></i><span id="timeGreeting"></span></p>
    <h1 class="title"><span id="titleText"></span><span class="cursor" aria-hidden="true"></span></h1>
    <div class="poem">
      <span class="poem-line" id="poemLine0"></span>
      <span class="poem-line" id="poemLine1"></span>
      <span class="poem-line" id="poemLine2"></span>
      <span class="poem-line" id="poemLine3"></span>
    </div>
    <p class="hint"><i class="fa-solid fa-wand-magic-sparkles"></i>Chạm vào những ngôi sao vàng để nhận lời chúc gửi riêng cho Như Ý</p>
  </main>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="card-star"></div>
      <p id="messageText"></p>
      <button class="close-btn" id="closeMessage"><i class="fa-solid fa-xmark"></i>Đóng lại</button>
    </div>
  </div>

  <button class="music-btn" id="musicBtn" aria-label="Bật nhạc nền">
    <i class="fa-solid fa-music icon-on"></i>
    <i class="fa-solid fa-volume-xmark icon-off"></i>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="night.js"></script>
</body>
</html>
